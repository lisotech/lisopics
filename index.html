<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lisopix - Online Picture Editor & Resizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #090d16;
            --bg-panel: #111827;
            --border: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        /* Strict overflow protection to eliminate left/right shifting on mobile */
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            max-width: 100%;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- DESKTOP LAYOUT (Sidebar / Features on the Right) --- */
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        header h1 {
            font-size: 1.5rem;
            color: #818cf8;
            font-weight: 700;
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 70px);
            overflow: hidden;
            flex-direction: row; /* Workspace left, Sidebar right */
            width: 100%;
        }

        sidebar {
            width: 340px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 1.5rem;
            gap: 1.25rem;
            max-height: calc(100vh - 70px);
            flex-shrink: 0;
        }

        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #030712;
            position: relative;
            overflow: auto;
            padding: 2rem;
            width: 100%;
        }

        .canvas-wrapper {
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.7);
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            display: block;
            background-image: linear-gradient(45deg, #1f2937 25%, transparent 25%), 
                              linear-gradient(-45deg, #1f2937 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #1f2937 75%), 
                              linear-gradient(-45deg, transparent 75%, #1f2937 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }

        /* Common Elements */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            width: 100%;
        }

        .control-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }
        .btn-secondary:hover { background-color: var(--border); }
        .btn.active-mode { background-color: #059669; border-color: #059669; }

        input[type="file"] { display: none; }

        .file-upload-label {
            border: 2px dashed var(--border);
            padding: 1rem;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: block;
            width: 100%;
        }
        .file-upload-label:hover { border-color: var(--primary); color: var(--text-main); }

        .dimension-inputs { display: flex; gap: 0.5rem; width: 100%; }
        .dimension-inputs input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: white;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
            min-width: 0;
        }
        
        /* Side-by-side aspect ratios grid */
        .aspect-ratios {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.4rem;
            width: 100%;
        }
        .aspect-btn {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.4rem;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
        }
        .aspect-btn:hover { border-color: var(--primary); background: rgba(79, 70, 229, 0.1); }
        .aspect-btn.active-ratio { background: var(--primary); border-color: var(--primary); }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            font-size: 1rem;
            padding: 1rem;
        }

        hr { border: none; border-top: 1px solid var(--border); width: 100%; }

        .stepper-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            width: 100%;
        }
        .stepper-btn {
            background: var(--border);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }
        .stepper-btn:hover { background: var(--primary); }

        .presets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            width: 100%;
        }
        .preset-chip {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }
        .preset-chip:hover { border-color: var(--primary); background: rgba(79, 70, 229, 0.1); }

        /* --- MOBILE SKETCH OVERRIDE (Width < 900px) --- */
        @media (max-width: 899px) {
            header {
                padding: 0.75rem 1rem;
            }
            header h1 {
                font-size: 1.2rem;
            }
            .main-container {
                flex-direction: column;
                height: auto;
                overflow: visible;
                width: 100%;
            }
            .workspace {
                order: 1;
                min-height: 250px;
                padding: 1rem;
                border-bottom: 1px solid var(--border);
                width: 100%;
            }
            canvas {
                max-height: 40vh;
            }
            sidebar {
                order: 2;
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border);
                max-height: none;
                overflow-y: visible;
                padding: 1rem;
                gap: 1rem;
            }
            .mobile-action-bar {
                order: 0;
                display: flex;
                gap: 0.5rem;
                padding: 0.75rem 1rem;
                background: var(--bg-panel);
                border-bottom: 1px solid var(--border);
                width: 100%;
            }
            .mobile-action-bar label, .mobile-action-bar button {
                flex: 1;
                margin: 0;
            }
        }

        @media (min-width: 900px) {
            .mobile-action-bar { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Lisopix</h1>
        <button id="downloadBtnTop" class="btn" style="display:none;">Download</button>
    </header>

    <div class="mobile-action-bar">
        <label for="imageUpload" class="btn btn-secondary" style="margin:0; cursor:pointer;">Browse</label>
        <button id="downloadBtnMobile" class="btn" style="display:none; margin:0;">Download</button>
    </div>

    <div class="main-container">
        <!-- Workspace (Picture on left) -->
        <div class="workspace">
            <div class="placeholder-text" id="placeholder">
                Your picture will show here after you upload it.<br><br>
                <span style="font-size: 0.85rem; color: #6b7280;">Let us do some magic ✨</span>
            </div>
            <div class="canvas-wrapper">
                <canvas id="canvas" style="display:none;"></canvas>
            </div>
        </div>

        <!-- Sidebar controls (Features on right) -->
        <sidebar>
            <div class="control-group desktop-upload-group" style="display: block;">
                <label>Source Image</label>
                <label for="imageUpload" class="file-upload-label">Browse Image File</label>
            </div>
            <input type="file" id="imageUpload" accept="image/*">

            <hr>

            <div class="control-group">
                <label>Resize & Crop</label>
                <div class="dimension-inputs">
                    <input type="number" id="widthInput" placeholder="Width">
                    <input type="number" id="heightInput" placeholder="Height">
                </div>
                <!-- Side-by-side aspect ratios -->
                <div class="aspect-ratios">
                    <button class="aspect-btn active-ratio" onclick="setAspect('free', event)">Free</button>
                    <button class="aspect-btn" onclick="setAspect('1:1', event)">1:1</button>
                    <button class="aspect-btn" onclick="setAspect('4:3', event)">4:3</button>
                    <button class="aspect-btn" onclick="setAspect('16:9', event)">16:9</button>
                </div>
                <div style="display: flex; gap: 0.5rem; margin-top: 0.4rem; width: 100%;">
                    <button id="resizeBtn" class="btn btn-secondary" style="flex:1;">Apply Size</button>
                    <button id="cropModeBtn" class="btn btn-secondary" style="flex:1;">Crop Tool</button>
                </div>
                <button id="applyCropBtn" class="btn" style="margin-top: 0.4rem; display:none; background-color:#059669; width:100%;">Confirm Crop</button>
            </div>

            <hr>

            <!-- Brightness Stepper -->
            <div class="control-group">
                <label>Brightness: <span id="brightnessVal">100%</span></label>
                <div class="stepper-row">
                    <button class="stepper-btn" onclick="adjustValue('brightnessRange', -5)">-</button>
                    <input type="range" id="brightnessRange" min="0" max="200" value="100" style="flex:1;">
                    <button class="stepper-btn" onclick="adjustValue('brightnessRange', 5)">+</button>
                </div>
            </div>

            <!-- Contrast Stepper -->
            <div class="control-group">
                <label>Contrast: <span id="contrastVal">100%</span></label>
                <div class="stepper-row">
                    <button class="stepper-btn" onclick="adjustValue('contrastRange', -5)">-</button>
                    <input type="range" id="contrastRange" min="0" max="200" value="100" style="flex:1;">
                    <button class="stepper-btn" onclick="adjustValue('contrastRange', 5)">+</button>
                </div>
            </div>

            <!-- Saturation Stepper -->
            <div class="control-group">
                <label>Saturation: <span id="saturationVal">100%</span></label>
                <div class="stepper-row">
                    <button class="stepper-btn" onclick="adjustValue('saturationRange', -5)">-</button>
                    <input type="range" id="saturationRange" min="0" max="200" value="100" style="flex:1;">
                    <button class="stepper-btn" onclick="adjustValue('saturationRange', 5)">+</button>
                </div>
            </div>

            <hr>

            <!-- Filter Presets from Sketch -->
            <div class="control-group">
                <label>Filter Presets</label>
                <div class="presets-grid">
                    <button class="preset-chip" onclick="applyPreset('normal')">Normal</button>
                    <button class="preset-chip" onclick="applyPreset('vintage')">Vintage</button>
                    <button class="preset-chip" onclick="applyPreset('warm')">Warm</button>
                    <button class="preset-chip" onclick="applyPreset('cool')">Cool</button>
                    <button class="preset-chip" onclick="applyPreset('bw')">B & W</button>
                    <button class="preset-chip" onclick="applyPreset('vivid')">Vivid</button>
                    <button class="preset-chip" onclick="applyPreset('dramatic')">Dramatic</button>
                </div>
            </div>

            <hr>

            <div class="control-group">
                <label>Transform</label>
                <div style="display: flex; gap: 0.5rem; width:100%;">
                    <button id="rotateBtn" class="btn btn-secondary" style="flex:1;">Rotate 90°</button>
                    <button id="flipHBtn" class="btn btn-secondary" style="flex:1;">Flip H</button>
                </div>
            </div>

            <button id="resetBtn" class="btn btn-secondary" style="margin-top: 0.5rem; width:100%;">Reset All Changes</button>
        </sidebar>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        
        const downloadBtnTop = document.getElementById('downloadBtnTop');
        const downloadBtnMobile = document.getElementById('downloadBtnMobile');

        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');
        const resizeBtn = document.getElementById('resizeBtn');
        const rotateBtn = document.getElementById('rotateBtn');
        const flipHBtn = document.getElementById('flipHBtn');
        const cropModeBtn = document.getElementById('cropModeBtn');
        const applyCropBtn = document.getElementById('applyCropBtn');

        const brightnessRange = document.getElementById('brightnessRange');
        const contrastRange = document.getElementById('contrastRange');
        const saturationRange = document.getElementById('saturationRange');
        const resetBtn = document.getElementById('resetBtn');

        let img = new Image();
        let fileName = 'lisopix-image.png';
        let originalWidth = 0;
        let originalHeight = 0;
        let rotationAngle = 0;
        let isFlippedH = false;

        let isCropMode = false;
        let isDragging = false;
        let startX = 0, startY = 0, endX = 0, endY = 0;
        let currentAspect = 'free';

        if (window.innerWidth < 900) {
            document.querySelector('.desktop-upload-group').style.display = 'none';
        }

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileName = file.name;
            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = function(event) {
                img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    originalWidth = img.width;
                    originalHeight = img.height;
                    widthInput.value = originalWidth;
                    heightInput.value = originalHeight;
                    
                    resetFilters();
                    rotationAngle = 0;
                    isFlippedH = false;
                    disableCropMode();

                    drawImageToCanvas();
                    
                    canvas.style.display = 'block';
                    placeholder.style.display = 'none';
                    downloadBtnTop.style.display = 'inline-flex';
                    downloadBtnMobile.style.display = 'inline-flex';
                }
            }
        });

        function setAspect(ratio, event) {
            currentAspect = ratio;
            document.querySelectorAll('.aspect-btn').forEach(btn => btn.classList.remove('active-ratio'));
            event.target.classList.add('active-ratio');
            if (!img.src) return;

            let curW = parseInt(widthInput.value) || originalWidth;
            let curH = parseInt(heightInput.value) || originalHeight;

            if (ratio === '1:1') {
                let size = Math.min(curW, curH);
                widthInput.value = size;
                heightInput.value = size;
            } else if (ratio === '4:3') {
                heightInput.value = Math.round((curW * 3) / 4);
            } else if (ratio === '16:9') {
                heightInput.value = Math.round((curW * 9) / 16);
            }
            drawImageToCanvas();
        }

        function drawImageToCanvas(customCropRect = null) {
            let w = parseInt(widthInput.value) || originalWidth;
            let h = parseInt(heightInput.value) || originalHeight;

            if (customCropRect) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = customCropRect.w;
                tempCanvas.height = customCropRect.h;
                const tempCtx = tempCanvas.getContext('2d');
                
                tempCtx.drawImage(
                    canvas, 
                    customCropRect.x, customCropRect.y, customCropRect.w, customCropRect.h, 
                    0, 0, customCropRect.w, customCropRect.h
                );
                
                img.src = tempCanvas.toDataURL();
                img.onload = () => {
                    originalWidth = img.width;
                    originalHeight = img.height;
                    widthInput.value = originalWidth;
                    heightInput.value = originalHeight;
                    rotationAngle = 0;
                    isFlippedH = false;
                    drawImageToCanvas();
                };
                return;
            }

            if (rotationAngle === 90 || rotationAngle === 270) {
                canvas.width = h;
                canvas.height = w;
            } else {
                canvas.width = w;
                canvas.height = h;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            ctx.translate(canvas.width / 2, canvas.height / 2);
            if (rotationAngle) ctx.rotate((rotationAngle * Math.PI) / 180);
            if (isFlippedH) ctx.scale(-1, 1);

            ctx.filter = `
                brightness(${brightnessRange.value}%) 
                contrast(${contrastRange.value}%) 
                saturate(${saturationRange.value}%)
            `;

            let drawWidth = rotationAngle === 90 || rotationAngle === 270 ? h : w;
            let drawHeight = rotationAngle === 90 || rotationAngle === 270 ? w : h;

            ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
            ctx.restore();
        }

        function adjustValue(elementId, amount) {
            const el = document.getElementById(elementId);
            let newVal = parseInt(el.value) + amount;
            let min = parseInt(el.min) || 0;
            let max = parseInt(el.max) || 200;
            if (newVal < min) newVal = min;
            if (newVal > max) newVal = max;
            el.value = newVal;
            updateFilterLabelsAndCanvas();
        }

        function updateFilterLabelsAndCanvas() {
            document.getElementById('brightnessVal').innerText = brightnessRange.value + '%';
            document.getElementById('contrastVal').innerText = contrastRange.value + '%';
            document.getElementById('saturationVal').innerText = saturationRange.value + '%';
            drawImageToCanvas();
        }

        [brightnessRange, contrastRange, saturationRange].forEach(input => {
            input.addEventListener('input', updateFilterLabelsAndCanvas);
        });

        function applyPreset(type) {
            if (!img.src) return;
            switch(type) {
                case 'vintage':
                    brightnessRange.value = 110;
                    contrastRange.value = 90;
                    saturationRange.value = 60;
                    break;
                case 'warm':
                    brightnessRange.value = 105;
                    contrastRange.value = 110;
                    saturationRange.value = 130;
                    break;
                case 'cool':
                    brightnessRange.value = 95;
                    contrastRange.value = 120;
                    saturationRange.value = 80;
                    break;
                case 'bw':
                    brightnessRange.value = 100;
                    contrastRange.value = 140;
                    saturationRange.value = 0;
                    break;
                case 'vivid':
                    brightnessRange.value = 105;
                    contrastRange.value = 130;
                    saturationRange.value = 170;
                    break;
                case 'dramatic':
                    brightnessRange.value = 90;
                    contrastRange.value = 160;
                    saturationRange.value = 110;
                    break;
                case 'normal':
                default:
                    resetFilters();
                    break;
            }
            updateFilterLabelsAndCanvas();
        }

        cropModeBtn.addEventListener('click', () => {
            if (!img.src) return;
            isCropMode = !isCropMode;
            if (isCropMode) {
                cropModeBtn.classList.add('active-mode');
                cropModeBtn.innerText = "Cancel Crop";
                applyCropBtn.style.display = 'inline-flex';
                alert("Crop Mode Active: Click and drag over your picture on the canvas to outline the crop region.");
            } else {
                disableCropMode();
                drawImageToCanvas();
            }
        });

        function disableCropMode() {
            isCropMode = false;
            cropModeBtn.classList.remove('active-mode');
            cropModeBtn.innerText = "Crop Tool";
            applyCropBtn.style.display = 'none';
            isDragging = false;
        }

        canvas.addEventListener('mousedown', (e) => {
            if (!isCropMode) return;
            const rect = canvas.getBoundingClientRect();
            isDragging = true;
            startX = (e.clientX - rect.left) * (canvas.width / rect.width);
            startY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isCropMode || !isDragging) return;
            const rect = canvas.getBoundingClientRect();
            endX = (e.clientX - rect.left) * (canvas.width / rect.width);
            endY = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (currentAspect === '1:1') {
                let diff = Math.abs(endX - startX);
                endY = startY + (endY > startY ? diff : -diff);
            } else if (currentAspect === '4:3') {
                let diffX = endX - startX;
                endY = startY + (diffX * 3) / 4;
            } else if (currentAspect === '16:9') {
                let diffX = endX - startX;
                endY = startY + (diffX * 9) / 16;
            }

            drawImageToCanvas(); 
            
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.setLineDash([6]);
            ctx.strokeRect(startX, startY, endX - startX, endY - startY);
            ctx.setLineDash([]);
        });

        canvas.addEventListener('mouseup', () => {
            if (isCropMode) isDragging = false;
        });

        applyCropBtn.addEventListener('click', () => {
            let cropW = Math.abs(endX - startX);
            let cropH = Math.abs(endY - startY);
            if (cropW < 10 || cropH < 10) {
                alert("Please drag a selection box on the image first.");
                return;
            }
            let cropX = Math.min(startX, endX);
            let cropY = Math.min(startY, endY);

            disableCropMode();
            drawImageToCanvas({ x: cropX, y: cropY, w: cropW, h: cropH });
        });

        resizeBtn.addEventListener('click', () => drawImageToCanvas());
        rotateBtn.addEventListener('click', () => {
            rotationAngle = (rotationAngle + 90) % 360;
            drawImageToCanvas();
        });
        flipHBtn.addEventListener('click', () => {
            isFlippedH = !isFlippedH;
            drawImageToCanvas();
        });

        function resetFilters() {
            brightnessRange.value = 100;
            contrastRange.value = 100;
            saturationRange.value = 100;
            updateFilterLabelsAndCanvas();
        }

        resetBtn.addEventListener('click', () => {
            if (!img.src) return;
            widthInput.value = originalWidth;
            heightInput.value = originalHeight;
            rotationAngle = 0;
            isFlippedH = false;
            disableCropMode();
            resetFilters();
            drawImageToCanvas();
        });

        function downloadImage() {
            const link = document.createElement('a');
            link.download = `lisopix-${fileName}`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        downloadBtnTop.addEventListener('click', downloadImage);
        downloadBtnMobile.addEventListener('click', downloadImage);
    </script>
</body>
</html>
