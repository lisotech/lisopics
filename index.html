<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisopix - Online Picture Editor & Resizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #090d16;
            --bg-panel: #111827;
            --border: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
            color: #818cf8;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 70px);
            overflow: hidden;
        }

        sidebar {
            width: 340px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 1.5rem;
            gap: 1.25rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .control-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-label {
            border: 2px dashed var(--border);
            padding: 1.25rem;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: border-color 0.2s, color 0.2s;
            font-size: 0.9rem;
        }

        .file-upload-label:hover {
            border-color: var(--primary);
            color: var(--text-main);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .range-value {
            font-size: 0.8rem;
            text-align: right;
            color: var(--text-muted);
            float: right;
        }

        .dimension-inputs {
            display: flex;
            gap: 0.5rem;
        }

        .dimension-inputs input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: white;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #030712;
            position: relative;
            overflow: auto;
            padding: 2rem;
        }

        .canvas-wrapper {
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.7);
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            background-image: linear-gradient(45deg, #1f2937 25%, transparent 25%), 
                              linear-gradient(-45deg, #1f2937 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #1f2937 75%), 
                              linear-gradient(-45deg, transparent 75%, #1f2937 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            font-size: 1.1rem;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header>
        <h1>Lisopix</h1>
        <button id="downloadBtn" class="btn" style="display:none;">Download Final Image</button>
    </header>

    <div class="main-container">
        <sidebar>
            <div class="control-group">
                <label>Source Image</label>
                <label for="imageUpload" class="file-upload-label">Browse Image File</label>
                <input type="file" id="imageUpload" accept="image/*">
            </div>

            <hr>

            <div class="control-group">
                <label>Resize Canvas</label>
                <div class="dimension-inputs">
                    <input type="number" id="widthInput" placeholder="Width">
                    <input type="number" id="heightInput" placeholder="Height">
                </div>
                <button id="resizeBtn" class="btn btn-secondary" style="margin-top: 0.4rem;">Apply Dimensions</button>
            </div>

            <hr>

            <div class="control-group">
                <label>Transform Options</label>
                <div style="display: flex; gap: 0.5rem;">
                    <button id="rotateBtn" class="btn btn-secondary" style="flex:1;">Rotate 90°</button>
                    <button id="flipHBtn" class="btn btn-secondary" style="flex:1;">Flip Horizontal</button>
                </div>
            </div>

            <hr>

            <div class="control-group">
                <label>Brightness <span id="brightnessVal" class="range-value">100%</span></label>
                <input type="range" id="brightnessRange" min="0" max="200" value="100">
            </div>

            <div class="control-group">
                <label>Contrast <span id="contrastVal" class="range-value">100%</span></label>
                <input type="range" id="contrastRange" min="0" max="200" value="100">
            </div>

            <div class="control-group">
                <label>Saturation <span id="saturationVal" class="range-value">100%</span></label>
                <input type="range" id="saturationRange" min="0" max="200" value="100">
            </div>

            <hr>

            <button id="resetBtn" class="btn btn-secondary">Reset Adjustments</button>
        </sidebar>

        <div class="workspace">
            <div class="placeholder-text" id="placeholder">Upload an image file to launch the Lisopix workspace</div>
            <div class="canvas-wrapper">
                <canvas id="canvas" style="display:none;"></canvas>
            </div>
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        const downloadBtn = document.getElementById('downloadBtn');

        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');
        const resizeBtn = document.getElementById('resizeBtn');
        const rotateBtn = document.getElementById('rotateBtn');
        const flipHBtn = document.getElementById('flipHBtn');

        const brightnessRange = document.getElementById('brightnessRange');
        const contrastRange = document.getElementById('contrastRange');
        const saturationRange = document.getElementById('saturationRange');
        const resetBtn = document.getElementById('resetBtn');

        let img = new Image();
        let fileName = 'lisopix-image.png';
        let originalWidth = 0;
        let originalHeight = 0;
        let rotationAngle = 0;
        let isFlippedH = false;

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileName = file.name;
            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = function(event) {
                img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    originalWidth = img.width;
                    originalHeight = img.height;
                    widthInput.value = originalWidth;
                    heightInput.value = originalHeight;
                    
                    resetFilters();
                    rotationAngle = 0;
                    isFlippedH = false;

                    drawImageToCanvas();
                    
                    canvas.style.display = 'block';
                    placeholder.style.display = 'none';
                    downloadBtn.style.display = 'inline-flex';
                }
            }
        });

        function drawImageToCanvas() {
            let w = parseInt(widthInput.value) || originalWidth;
            let h = parseInt(heightInput.value) || originalHeight;

            if (rotationAngle === 90 || rotationAngle === 270) {
                canvas.width = h;
                canvas.height = w;
            } else {
                canvas.width = w;
                canvas.height = h;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            ctx.translate(canvas.width / 2, canvas.height / 2);
            if (rotationAngle) ctx.rotate((rotationAngle * Math.PI) / 180);
            if (isFlippedH) ctx.scale(-1, 1);

            ctx.filter = `
                brightness(${brightnessRange.value}%) 
                contrast(${contrastRange.value}%) 
                saturate(${saturationRange.value}%)
            `;

            let drawWidth = rotationAngle === 90 || rotationAngle === 270 ? h : w;
            let drawHeight = rotationAngle === 90 || rotationAngle === 270 ? w : h;

            ctx.drawImage(img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
            ctx.restore();
        }

        resizeBtn.addEventListener('click', () => drawImageToCanvas());
        rotateBtn.addEventListener('click', () => {
            rotationAngle = (rotationAngle + 90) % 360;
            drawImageToCanvas();
        });
        flipHBtn.addEventListener('click', () => {
            isFlippedH = !isFlippedH;
            drawImageToCanvas();
        });

        [brightnessRange, contrastRange, saturationRange].forEach(input => {
            input.addEventListener('input', (e) => {
                document.getElementById(e.target.id.replace('Range', 'Val')).innerText = e.target.value + '%';
                drawImageToCanvas();
            });
        });

        function resetFilters() {
            brightnessRange.value = 100;
            contrastRange.value = 100;
            saturationRange.value = 100;
            document.getElementById('brightnessVal').innerText = '100%';
            document.getElementById('contrastVal').innerText = '100%';
            document.getElementById('saturationVal').innerText = '100%';
        }

        resetBtn.addEventListener('click', () => {
            if (!img.src) return;
            widthInput.value = originalWidth;
            heightInput.value = originalHeight;
            rotationAngle = 0;
            isFlippedH = false;
            resetFilters();
            drawImageToCanvas();
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `edited-${fileName}`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
